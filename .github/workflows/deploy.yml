name: Publier sur Hostinger

# Publie le site sur l'hébergement à chaque envoi sur `main`.
# Ne fait rien tant que les trois secrets FTP_HOST / FTP_USER / FTP_PASSWORD
# ne sont pas renseignés dans GitHub (Settings → Secrets and variables →
# Actions). Voir docs/DEPLOIEMENT-HOSTINGER.md.

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi de publier à la demande, depuis l'onglet Actions

concurrency:
  group: deploy-hostinger   # deux envois rapprochés ne se marchent pas dessus
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier que les secrets existent
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          if [ -z "$FTP_HOST" ]; then
            echo "::error::Les secrets FTP ne sont pas configurés. Voir docs/DEPLOIEMENT-HOSTINGER.md."
            exit 1
          fi

      - name: Constituer le dossier à publier
        # On n'envoie pas tout le dépôt : la documentation, les sources de
        # marque et le journal d'erreurs n'ont rien à faire en ligne.
        run: |
          mkdir -p _publish
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            --exclude='brand' \
            --exclude='README.md' \
            --exclude='ERRORS_LOG.md' \
            --exclude='.gitignore' \
            --exclude='_publish' \
            ./ _publish/
          echo "Fichiers qui vont être publiés :"
          find _publish -type f | sort

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer les fichiers
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          # lftp lit le mot de passe dans cette variable : il n'apparaît donc
          # jamais dans la ligne de commande ni dans les journaux.
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set cmd:fail-exit true;
            set ftp:ssl-allow true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set net:max-retries 3;
            set net:timeout 20;
            open -u \"$FTP_USER\",\"\" --env-password \"$FTP_HOST\";
            mirror --reverse --verbose --parallel=3 _publish/ /public_html/;
          "

      - name: Terminé
        run: echo "Site publié sur https://alexowebdesign.com"
